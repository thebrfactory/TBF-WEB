<!--
  FAVICON .TBF.: a estrela do BRANDBOOK, recortada para o quadrado do favicon.
  Derivado de _SHARED/BRANDBOOK/BRAND/TBF/FAVICON.svg (fonte unica, nao editar aqui).
  A fonte vem numa prancheta 1920x1080; aqui o viewBox e o quadrado justo em
  volta da estrela.

  POR QUE TILE PRETO, e nao a estrela solta.
  A estrela da marca e #06062b, azul quase preto: solta, ela some na barra de
  guias escura. A primeira tentativa foi trocar a cor por @media
  (prefers-color-scheme: dark) dentro do proprio SVG. NAO FUNCIONA: o Chrome
  desenha o favicon num contexto isolado e ignora a media query, e o icone saiu
  invisivel na aba. Tile preto com a estrela creme le em qualquer fundo, casa
  com o theme_color #000000 do manifest, e e igual aos PNG de fallback.
-->
